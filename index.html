.t-sub, .t-quote { font-size: 13px; color: var(--ink-secondary); }
.t-quote { overflow-wrap: anywhere; }
.status-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 11px 18px; padding: 14px; background: var(--surface-muted); border-radius: var(--r-md); }
.ss-k { color: var(--ink-secondary); font-size: 12px; }
.ss-v { margin-top: 2px; font-weight: 650; font-size: 13px; }
.status-actions { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 1150px) {
  .workspace-grid { grid-template-columns: minmax(0,1fr) 295px; gap: 14px; }
  .flight-card { gap: 10px; grid-template-columns: minmax(104px,1fr) minmax(155px,1.4fr) minmax(89px,auto) 18px; }
  .hotels-split { grid-template-columns: minmax(0,1fr); }
  .map-canvas { height: 310px; }
}
@media (max-width: 920px) {
  .view-head { align-items: flex-start; flex-direction: column; }
  .dir-tabs { align-self: flex-start; }
  .header-inner, .page { padding-inline: 18px; }
  .search-bar { grid-template-columns: repeat(4,minmax(0,1fr)); }
  .search-bar > .btn-primary { grid-column: 1 / -1; min-height: 44px; }
}
@media (max-width: 820px) {
  .workspace-grid { grid-template-columns: minmax(0,1fr); }
  .side-col { position: static; }
  .start-hero { min-height: 0; }
  .hero-copy { padding: 24px 20px 18px; }
  .start-cards { grid-template-columns: 1fr; }
  .start-actions { flex-wrap: wrap; }
}
@media (max-width: 480px) {
  .header-inner, .page { padding-inline: 12px; }
  .user-name { display: none; }
  .search-bar { grid-template-columns: 1fr 1fr; margin: 0 10px 10px; }
  .hero-photo { background-size: auto 100%; opacity: .6; }
  .cal-pop.align-right { left: 0; right: auto; width: min(280px, calc(100vw - 55px)); }
  .seg:nth-child(2) .popover { left: auto; right: 0; }
  .step-card { grid-template-columns: 22px minmax(0,1fr); padding: 7px 5px; gap: 5px; }
  .sc-dot { width: 22px; height: 22px; }
  .sc-label { font-size: 11px; }
  .sc-value { font-size: 10px; }
  .tl-chart { grid-template-columns: 73px minmax(0,1fr); column-gap: 6px; }
  .tl-label, .tl-axis { font-size: 9px; }
  .tl-top { flex-wrap: wrap; }
  .tl-note { display: block; min-height: 46px; }
  .flight-card { grid-template-columns: minmax(0,1fr) minmax(85px,auto) 18px; }
  .fc-airline { grid-column: 1 / -1; }
  .fc-route { grid-column: 1; }
  .fc-time { font-size: 18px; }
  .fc-price { font-size: 17px; }
  .status-summary { grid-template-columns: 1fr; }
}
